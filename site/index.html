<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>phoneoperator playground</title>
<meta name="description" content="Operator and region of a Russian phone number, offline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7c66'/%3E%3Cpath d='M11 7h4l2 5-3 2a11 11 0 0 0 4 4l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 9 9a2 2 0 0 1 2-2z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --ink: #1b1d1c;
  --muted: #676d69;
  --line: #e2e0d8;
  --accent: #0e7c66;
  --accent-soft: #e2f2ed;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111413;
    --panel: #1a1e1c;
    --ink: #eceeed;
    --muted: #9aa29e;
    --line: #2c3230;
    --accent: #3fc6a4;
    --accent-soft: #173229;
    --danger: #ff8a80;
    --danger-soft: #3a1c1a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.tagline { margin: 4px 0 0; color: var(--muted); }
nav { display: flex; gap: 8px; }
nav a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
nav a:hover { border-color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
label { font-size: 14px; color: var(--muted); }
input { width: 100%; font: inherit; font-family: var(--mono); font-size: 22px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); outline: none; }
input:focus { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips button { font: inherit; font-size: 13px; font-family: var(--mono); border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chips button:hover { color: var(--accent); border-color: var(--accent); }
.result { margin-top: 24px; }
.brand { font-size: 30px; font-weight: 700; margin: 0; }
.formatted { font-family: var(--mono); color: var(--accent); margin: 2px 0 16px; font-size: 18px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; overflow-wrap: anywhere; }
.message { margin-top: 20px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); padding: 14px 16px; }
.note { color: var(--muted); font-size: 14px; margin-top: 20px; }
h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 14px; overflow-x: auto; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>phone<span>operator</span></h1>
      <p class="tagline">Оператор и регион российского номера, офлайн, по реестру Минцифры</p>
    </div>
    <nav>
      <a href="https://github.com/MrProLopstar/phoneoperator">GitHub</a>
      <a href="https://www.npmjs.com/package/phoneoperator">npm</a>
    </nav>
  </header>

  <section class="card">
    <label for="phone">Номер телефона</label>
    <input id="phone" type="tel" autocomplete="off" spellcheck="false" placeholder="+7 916 123-45-67">
    <div class="chips" id="examples"></div>

    <div class="result" id="result" hidden>
      <p class="brand" id="brand"></p>
      <p class="formatted" id="formatted"></p>
      <dl>
        <dt>Тип</dt><dd id="type"></dd>
        <dt>Юрлицо</dt><dd id="name"></dd>
        <dt>ИНН</dt><dd id="inn"></dd>
        <dt>Регион</dt><dd id="region"></dd>
        <dt id="locality-label">Населённый пункт</dt><dd id="locality"></dd>
      </dl>
    </div>
    <div class="message" id="message" hidden></div>
    <p class="note" id="note"></p>
  </section>

  <h2>Установка</h2>
  <pre>npm install phoneoperator</pre>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
